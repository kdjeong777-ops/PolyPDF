name: CI (tests)

# 푸시·PR 마다 오프스크린으로 GUI 회귀 테스트(자체 PDF 생성 테스트만; OCR/녹화 바이너리 불필요)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install babel==2.18.0      # 261008: 언어팩 검사(test_i18n_*) — 빌드 도구라 requirements 밖(다국어 SOT §3.5)

      - name: Run offscreen GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          # 261009-9(다국어 SOT §3.5·§9): .mo 는 커밋하지 않는 빌드 산출물 — 실제 번역을 읽는 검사(switch·outputs·external·installer) 전에 만든다
          python scripts/i18n.py compile
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $tests = @(
            "test_draw_paint","test_draw_unify","test_main_draw_v2","test_pen45",
            "test_image_geom","test_image_tools","test_image_annot",
            "test_panel_toolbar","test_capture","test_bookmark_panel","test_fullwidth",
            "test_present_draw","test_present_erase","test_present_options","test_present_split",
            "test_close_edit_confirm",
            "test_i18n_core","test_i18n_packs","test_i18n_keys",
            "test_i18n_coverage","test_i18n_switch","test_i18n_outputs","test_i18n_external","test_i18n_installer",
            "test_i18n_settings_layout","test_i18n_panel_layout",
            "test_index_corrupt_recover","test_startup_open_arg","test_present_decorations","test_kiwi_space","test_index_proc","test_profile_isolation","test_thumbs_rerender","test_portable_mode"
          )
          $fail = 0
          foreach ($t in $tests) {
            Write-Host "=== $t ==="
            python "$t.py"
            if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: $t"; $fail = 1 }
          }
          if ($fail -ne 0) { exit 1 }
