name: Release (build Windows exe)

# 버전 태그(v1.88.0 등)를 push 하면 Windows 빌드 → zip → GitHub Release 에 자동 업로드.
#   git tag v1.88.0 && git push origin v1.88.0
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:          # 수동 실행도 허용

permissions:
  contents: write             # Release 생성/업로드 권한

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 261008-18(U14): 릴리스 설명을 이전 태그부터의 커밋으로 만든다

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      # --- 선택: 전체 기능(OCR/녹화)용 바이너리 동봉. 실패해도 핵심 뷰어는 빌드됨 ---
      - name: Stage ffmpeg (recording) — optional
        continue-on-error: true
        run: |
          choco install ffmpeg -y --no-progress
          $ff = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if ($ff) { Copy-Item $ff ".\ffmpeg.exe" -Force; echo "ffmpeg staged" }

      # 260910(사용자 보고 "빌드된 것에 kor 이 없어 한국어 OCR 이 안 된다", 단어학습 SOT §14.13)
      #   `tesseract/` 는 .gitignore 라 체크아웃에 없다 → CI 가 **스스로 마련해야** 한다.
      #   choco 기본 설치에는 **eng 만** 있어 `kor` 은 따로 받는다.
      - name: Stage Tesseract (OCR)
        continue-on-error: true
        run: |
          choco install tesseract -y --no-progress
          $dir = "C:\\Program Files\\Tesseract-OCR"
          if (Test-Path "$dir\\tesseract.exe") {
            New-Item -ItemType Directory -Force ".\\tesseract" | Out-Null
            Copy-Item "$dir\\*" ".\\tesseract" -Recurse -Force
            echo "tesseract staged"
          }

      - name: Stage Korean tessdata (kor, osd, eng)
        continue-on-error: true
        run: |
          $td = ".\\tesseract\\tessdata"
          New-Item -ItemType Directory -Force $td | Out-Null
          $base = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main"
          foreach ($lang in @("kor", "osd", "eng")) {
            $dst = Join-Path $td "$lang.traineddata"
            if (Test-Path $dst) { continue }
            Invoke-WebRequest -Uri "$base/$lang.traineddata" -OutFile $dst -UseBasicParsing
            echo "downloaded $lang"
          }
          Get-ChildItem $td | Select-Object Name, Length

      # ★ 여기서 실패하면 배포를 멈춘다 — 종전에는 조용히 넘어가 **OCR 없는 배포본**이
      #   나갔다(사용자 보고 260910). 없으면 고치고 태그를 다시 밀어야 한다.
      - name: Verify OCR bundle (fail the release if missing)
        shell: pwsh
        run: |
          $exe = @(".\\tesseract\\tesseract.exe",
                   ".\\tesseract\\Library\\bin\\tesseract.exe") |
                 Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "tesseract.exe 가 없습니다 - OCR 없는 배포본은 내지 않는다" }
          $dirs = @(".\\tesseract\\tessdata", ".\\tesseract\\share\\tessdata")
          foreach ($lang in @("eng", "kor")) {
            $hit = $dirs | Where-Object { Test-Path (Join-Path $_ "$lang.traineddata") }
            if (-not $hit) { throw "$lang.traineddata 가 없습니다 - 한국어 OCR 이 안 됩니다" }
          }
          echo "OCR bundle ok: $exe"

      - name: Stage NLTK WordNet (vocab) — optional
        continue-on-error: true
        run: python -m nltk.downloader -d nltk_data wordnet omw-1.4

      - name: Build (PyInstaller via build_ci.bat)
        run: cmd /c build_ci.bat

      - name: Package zips (full + update)
        id: pkg
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "dev" }
          $full = "PolyPDF-$tag-win64.zip"
          Compress-Archive -Path "dist\PolyPDF\*" -DestinationPath $full -Force
          # 260618-14: 업데이트용 zip — 안 바뀌는 무거운 부분 제외(앱이 우선 사용, 기존 설치분 보존)
          $stage = "$env:TEMP\polypdf_upd"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Copy-Item "dist\PolyPDF" $stage -Recurse
          # 260910-6(사용자 보고 "설치본에 아직 kor 이 없다", 단어학습 SOT §14.17):
          #   무거운 자산은 '안 바뀐다' 는 가정으로 빼 왔는데, `kor` 은 beta.142 에서
          #   **새로 들어온 파일**이었다. 그래서 한 번이라도 앱 안에서 업데이트한
          #   설치본은 새 배포본을 내도 영영 `kor` 을 못 받았다.
          #   → 엔진·DLL(약 100MB)은 계속 빼되 **`tessdata` 는 남긴다**(약 16MB).
          #     바뀌는 것은 언어 자료이지 엔진이 아니다.
          foreach ($p in @("ffmpeg.exe","kiwipiepy_model","nltk_data")) {
            $t = Join-Path "$stage\_internal" $p
            if (Test-Path $t) { Remove-Item $t -Recurse -Force }
          }
          $tess = Join-Path "$stage\_internal" "tesseract"
          if (Test-Path $tess) {
            Get-ChildItem $tess -Force | Where-Object { $_.Name -ne "tessdata" } |
              Remove-Item -Recurse -Force
            $kept = Join-Path $tess "tessdata"
            if (Test-Path $kept) {
              Write-Host "update zip keeps tessdata:"
              Get-ChildItem $kept -Filter *.traineddata | Select-Object Name, Length
            }
          }
          $upd = "PolyPDF-$tag-win64-update.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $upd -Force
          # 261009-22(마스터 §14.9): 휴대용(무설치) zip — 맨 위 PolyPDF\ 폴더 + exe 옆 표식 PolyPDF.portable.
          #   표식이 있으면 앱이 설정·색인을 그 폴더의 Data\ 에 둔다. 업데이트는 update zip 그대로(updater 가 portable 을 고르지 않는다).
          $port = "PolyPDF-$tag-win64-portable.zip"
          $pst = "$env:TEMP\polypdf_port"
          if (Test-Path $pst) { Remove-Item $pst -Recurse -Force }
          New-Item -ItemType Directory $pst | Out-Null
          Copy-Item "dist\PolyPDF" "$pst\PolyPDF" -Recurse
          # 261010-2: 표식 글은 ASCII 만 — 한글 줄이 CI 에서 깨졌다(릴리스 portable zip 을 내려받아 실측). 한글 안내는 README.
          @("PolyPDF portable mode marker.",
            "If this file exists next to PolyPDF.exe, settings and the search index are stored in the Data folder here.",
            "Delete it to use the user folder (%APPDATA%) instead.") |
            Out-File -FilePath "$pst\PolyPDF\PolyPDF.portable" -Encoding utf8
          Compress-Archive -Path "$pst\PolyPDF" -DestinationPath $port -Force
          # 260628(보안 A): 자동 업데이트 무결성 검증용 SHA-256 자산.
          #   앱은 '<자산명>.sha256' 을 찾아 다운로드 직후 + **압축 해제 직전(승격 인스턴스 포함)**
          #   다시 검증한다. 형식은 sha256sum 관례(`<hex>  <파일명>`).
          foreach ($z in @($full, $upd, $port)) {
            $h = (Get-FileHash -LiteralPath $z -Algorithm SHA256).Hash.ToLower()
            "$h  $z" | Out-File -FilePath "$z.sha256" -Encoding ascii -NoNewline
          }
          # 260628-12(U8): 잔존 파일 정리용 **정식 파일목록**. full 빌드 기준 상대경로.
          #   업데이트 zip 은 무거운 자산을 빼므로 목록은 반드시 **full 빌드**에서 뽑아야 한다
          #   (update zip 기준으로 만들면 ffmpeg·tesseract 가 지워진다).
          $man = "PolyPDF-$tag-win64.manifest.txt"
          $base = (Resolve-Path 'dist\PolyPDF').Path.TrimEnd('\') + '\'
          Get-ChildItem -LiteralPath 'dist\PolyPDF' -Recurse -File -Force |
            ForEach-Object { $_.FullName.Substring($base.Length) } |
            Sort-Object | Out-File -FilePath $man -Encoding utf8
          echo "manifest=$man" >> $env:GITHUB_OUTPUT
          echo "full=$full" >> $env:GITHUB_OUTPUT
          echo "upd=$upd" >> $env:GITHUB_OUTPUT
          echo "fullsha=$full.sha256" >> $env:GITHUB_OUTPUT
          echo "updsha=$upd.sha256" >> $env:GITHUB_OUTPUT
          echo "port=$port" >> $env:GITHUB_OUTPUT
          echo "portsha=$port.sha256" >> $env:GITHUB_OUTPUT

      # --- 설치 프로그램(setup.exe): Program Files 설치 + PDF 기본앱 연결 + API키 안내 ---
      - name: Build installer (Inno Setup)
        id: inst
        continue-on-error: true        # 설치본 실패해도 zip 릴리스는 계속
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path "viewer\__init__.py" -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$ver" "installer\PolyPDF.iss"
          $setup = "PolyPDF-Setup-v$ver.exe"
          if (Test-Path $setup) { echo "setup=$setup" >> $env:GITHUB_OUTPUT; echo "installer built: $setup" }
          else { echo "installer NOT built" }

      # 261009-18(마스터 §14.5 U19): 산출물을 셋으로 나눈다 — 한 묶음(1GB)이면 설치 시험에 설치 프로그램(350MB)만 필요해도
      #   전부 받아야 했다(가정 Wi-Fi 0.5MB/s 로 40분). scripts/release_test.py 가 -setup(설치 시험)·-full(빌드 시험)만 받는다.
      - name: Upload artifact — installer
        if: steps.inst.outputs.setup != ''
        uses: actions/upload-artifact@v7
        with:
          name: PolyPDF-${{ github.ref_name }}-setup
          path: ${{ steps.inst.outputs.setup }}
          compression-level: 0

      - name: Upload artifact — full zip
        uses: actions/upload-artifact@v7
        with:
          name: PolyPDF-${{ github.ref_name }}-full
          path: ${{ steps.pkg.outputs.full }}
          compression-level: 0

      - name: Upload artifact — update zip
        uses: actions/upload-artifact@v7
        with:
          name: PolyPDF-${{ github.ref_name }}-update
          path: ${{ steps.pkg.outputs.upd }}
          compression-level: 0

      - name: Create or update GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $full = "${{ steps.pkg.outputs.full }}"
          $upd  = "${{ steps.pkg.outputs.upd }}"
          $setup = "${{ steps.inst.outputs.setup }}"
          # 자산 목록(설치본은 빌드된 경우에만 포함)
          # 260628(A): .sha256 자산도 함께 게시 — 없으면 앱이 무결성 검증을 생략한다.
          $assets = @($full, $upd, "${{ steps.pkg.outputs.fullsha }}", "${{ steps.pkg.outputs.updsha }}",
                      "${{ steps.pkg.outputs.manifest }}",   # 260628-12(U8)
                      "${{ steps.pkg.outputs.port }}", "${{ steps.pkg.outputs.portsha }}")   # 261009-22(마스터 §14.9) 휴대용
          if ($setup -and (Test-Path $setup)) { $assets += $setup }
          # 이미 릴리스가 있으면 없는 자산만 보충(수동 자산 보존). 없으면 새로 생성.
          # 260628-6: 태그에 -beta/-rc 등 접미사가 있으면 **GitHub prerelease 로 표시**한다.
          #   앱의 업데이트 채널 판정은 '태그 접미사'로 하고 이 플래그는 보지 않으므로
          #   (updater.check_latest) 앱 동작은 바뀌지 않는다. 목적은 릴리스 페이지에서
          #   베타가 'Latest' 배지를 달아 정식처럼 보이던 오해를 없애는 것.
          $isPre = $tag -match '-'
          # 261008-18(마스터 §14.5 U14): --generate-notes 는 PR 기준이라 'Full Changelog' 한 줄만 남았다
          #   → 이전 버전 태그부터의 커밋 메시지로 설명을 만든다(앱 업데이트 창이 보여 준다).
          python scripts/release_notes.py $tag notes.md        # 파일로 직접(UTF-8) — 파이프는 한글이 깨질 수 있다
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # 260618-35: --clobber 필수 — 릴리스가 이미 있고(수동 생성 등) 같은 이름 자산이
            #   있으면 --clobber 없이는 업로드 전체가 실패해 '새 자산(설치본)'까지 누락된다.
            gh release upload $tag $assets --clobber
            gh release edit $tag --notes-file notes.md
            if ($isPre) { gh release edit $tag --prerelease } else { gh release edit $tag --prerelease=false --latest }
            exit 0
          } else {
            if ($isPre) {
              gh release create $tag $assets --title "PolyPDF $tag" --notes-file notes.md --prerelease
            } else {
              gh release create $tag $assets --title "PolyPDF $tag" --notes-file notes.md --latest
            }
          }

      # 260913-14 (SOT 마스터 §14.5 U9): 버전 릴리스는 최근 10개만 둔다. git 태그는 지우지 않는다.
      #   릴리스는 이미 게시된 뒤라 정리 실패가 릴리스 실패로 보이지 않게 continue-on-error.
      - name: Prune old releases (keep newest 10, tags kept)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/prune_releases.ps1 -Keep 10 -Repo "${{ github.repository }}"
